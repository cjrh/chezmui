name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  # Build and retain artifacts without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Use an older glibc baseline than ubuntu-latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: chezmui
    steps:
      - uses: actions/checkout@v6
        with:
          path: chezmui
          persist-credentials: false

      # Preserve Cargo.toml's ../iced-themer path dependency. Update this pin
      # only after testing the new commit with --locked.
      - uses: actions/checkout@v6
        with:
          repository: cjrh/iced-themer
          ref: 83e420d3cc1e4b1a131dfae1366bdae06b559a61
          path: iced-themer
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chezmui -> target

      - name: Check tag against Cargo.toml
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "chezmui"))')
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config patchelf libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            desktop-file-utils xvfb xauth libx11-xcb1 libxcursor1 libxi6 libxrandr2

      - name: Check and test
        run: |
          cargo fmt --check
          cargo test --locked
          desktop-file-validate packaging/chezmui.desktop

      - name: Install linuxdeploy
        env:
          LINUXDEPLOY_VERSION: 1-alpha-20251107-1
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage" \
            --output "$RUNNER_TEMP/bin/linuxdeploy"
          echo "$LINUXDEPLOY_SHA256  $RUNNER_TEMP/bin/linuxdeploy" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/linuxdeploy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build release artifacts
        run: |
          # Do not upload older artifacts restored from a build cache.
          rm -rf -- target/dist
          ./build-appimage.sh

      - name: Smoke-test AppImage
        run: |
          # A GUI should remain open until timeout. A loader error or crash must
          # fail the release, even if linuxdeploy reported a successful build.
          status=0
          xvfb-run -a timeout --kill-after=5s 10s target/dist/*.AppImage --appimage-extract-and-run || status=$?
          if [[ "$status" != 124 ]]; then
            echo "AppImage exited early (status $status)" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: chezmui/target/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # A manual build must never publish, even if run against a tag.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum --check ./*.sha256
          # Stage new releases as drafts so a failed upload stays unpublished.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" ./*.AppImage ./*.tar.gz ./*.sha256 --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false
          fi
